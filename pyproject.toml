[project]
name = "llm-middleware"
version = "0.1.0"
description = "This middleware sits between your application and multiple LLM providers (OpenAI, Anthropic, Gemini) acting as a smart proxy. Instead of your app talking directly to one provider, every LLM call goes through this layer first."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "huggingface-hub>=1.17.0",
    "pydantic-settings>=2.14.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.2",
    "redis[asyncio]>=8.0.0",
    "sqlalchemy[asyncio]>=2.0.50",
    "tiktoken>=0.13.0",
    "uvicorn[standard]>=0.49.0",
]
